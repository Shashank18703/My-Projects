<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris Flower Classifier</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            width: 100%;
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        html {
            height: 100%;
        }

        .app-wrapper {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .icon-container svg {
            width: 48px;
            height: 48px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 16px;
            color: #718096;
            line-height: 1.5;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            display: block;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: #f7fafc;
            color: #2d3748;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]:hover {
            border-color: #cbd5e0;
        }

        .predict-btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-bottom: 24px;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .predict-btn:active {
            transform: translateY(0);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result {
            padding: 20px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            animation: slideIn 0.4s ease-out;
            width: 100%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.success {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #9ae6b4;
        }

        .result.error {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #fc8181;
        }

        .result.loading {
            background: #e6fffa;
            color: #234e52;
            border: 2px solid #81e6d9;
        }

        .species-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #81e6d9;
            border-radius: 50%;
            border-top-color: #234e52;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            .app-wrapper {
                padding: 32px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .input-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <main class="app-wrapper">
   <div class="header-section">
    <div class="icon-container">
     <svg viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C12 2 7 4 7 8C7 10 8 11 8 13C8 15 6 16 6 19C6 21 8 22 12 22C16 22 18 21 18 19C18 16 16 15 16 13C16 11 17 10 17 8C17 4 12 2 12 2Z" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /> <path d="M12 2C12 2 9 6 9 10C9 12 10 13 10 15C10 17 8 18 8 21" stroke="#667eea" stroke-width="1.5" stroke-linecap="round" />
     </svg>
    </div>
    <h1 id="main-title">Iris Flower Classifier</h1>
    <p class="subtitle" id="subtitle">Enter the sepal and petal measurements (in cm) to predict the Iris species.</p>
   </div>
   <form id="prediction-form">
    <div class="input-grid">
     <div class="input-group"><label for="sepal_length">Sepal Length (cm)</label> <input id="sepal_length" type="number" step="0.1" placeholder="e.g., 5.1" required>
     </div>
     <div class="input-group"><label for="sepal_width">Sepal Width (cm)</label> <input id="sepal_width" type="number" step="0.1" placeholder="e.g., 3.5" required>
     </div>
     <div class="input-group"><label for="petal_length">Petal Length (cm)</label> <input id="petal_length" type="number" step="0.1" placeholder="e.g., 1.4" required>
     </div>
     <div class="input-group"><label for="petal_width">Petal Width (cm)</label> <input id="petal_width" type="number" step="0.1" placeholder="e.g., 0.2" required>
     </div>
    </div><button type="submit" class="predict-btn" id="predict-btn"> <span id="button-text">Predict Species</span> </button>
   </form>
   <div class="result-container">
    <div id="result"></div>
   </div>
  </main>
  <script>
        const defaultConfig = {
            main_title: "Iris Flower Classifier",
            subtitle: "Enter the sepal and petal measurements (in cm) to predict the Iris species.",
            button_text: "Predict Species",
            primary_color: "#667eea",
            secondary_color: "#764ba2",
            background_gradient_start: "#667eea",
            background_gradient_end: "#764ba2",
            text_color: "#1a202c",
            font_family: "Inter",
            font_size: 16
        };

        async function onConfigChange(config) {
            const mainTitle = document.getElementById('main-title');
            const subtitle = document.getElementById('subtitle');
            const buttonText = document.getElementById('button-text');
            
            if (mainTitle) mainTitle.textContent = config.main_title || defaultConfig.main_title;
            if (subtitle) subtitle.textContent = config.subtitle || defaultConfig.subtitle;
            if (buttonText) buttonText.textContent = config.button_text || defaultConfig.button_text;

            // Apply colors
            const primaryColor = config.primary_color || defaultConfig.primary_color;
            const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
            const bgStart = config.background_gradient_start || defaultConfig.background_gradient_start;
            const bgEnd = config.background_gradient_end || defaultConfig.background_gradient_end;
            const textColor = config.text_color || defaultConfig.text_color;

            document.body.style.background = `linear-gradient(135deg, ${bgStart} 0%, ${bgEnd} 100%)`;
            document.querySelector('.icon-container').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
            document.querySelector('.predict-btn').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
            
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                input.style.setProperty('--focus-color', primaryColor);
            });

            document.querySelector('h1').style.color = textColor;

            // Apply font
            const customFont = config.font_family || defaultConfig.font_family;
            const baseFontStack = '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;

            // Apply font size
            const baseSize = config.font_size || defaultConfig.font_size;
            document.querySelector('h1').style.fontSize = `${baseSize * 2}px`;
            document.querySelector('.subtitle').style.fontSize = `${baseSize}px`;
            document.querySelectorAll('label').forEach(label => {
                label.style.fontSize = `${baseSize * 0.875}px`;
            });
            document.querySelector('.predict-btn').style.fontSize = `${baseSize * 1.125}px`;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [
                    {
                        get: () => config.background_gradient_start || defaultConfig.background_gradient_start,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ background_gradient_start: value });
                            }
                        }
                    },
                    {
                        get: () => config.background_gradient_end || defaultConfig.background_gradient_end,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ background_gradient_end: value });
                            }
                        }
                    },
                    {
                        get: () => config.text_color || defaultConfig.text_color,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ text_color: value });
                            }
                        }
                    },
                    {
                        get: () => config.primary_color || defaultConfig.primary_color,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ primary_color: value });
                            }
                        }
                    },
                    {
                        get: () => config.secondary_color || defaultConfig.secondary_color,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ secondary_color: value });
                            }
                        }
                    }
                ],
                borderables: [],
                fontEditable: {
                    get: () => config.font_family || defaultConfig.font_family,
                    set: (value) => {
                        if (window.elementSdk) {
                            window.elementSdk.setConfig({ font_family: value });
                        }
                    }
                },
                fontSizeable: {
                    get: () => config.font_size || defaultConfig.font_size,
                    set: (value) => {
                        if (window.elementSdk) {
                            window.elementSdk.setConfig({ font_size: value });
                        }
                    }
                }
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["main_title", config.main_title || defaultConfig.main_title],
                ["subtitle", config.subtitle || defaultConfig.subtitle],
                ["button_text", config.button_text || defaultConfig.button_text]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }

        const speciesEmojis = {
            'setosa': '🌸',
            'versicolor': '🌺',
            'virginica': '🌷'
        };

        document.getElementById('prediction-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sl = document.getElementById("sepal_length").value;
            const sw = document.getElementById("sepal_width").value;
            const pl = document.getElementById("petal_length").value;
            const pw = document.getElementById("petal_width").value;

            const resultDiv = document.getElementById("result");
            const predictBtn = document.getElementById("predict-btn");

            if (!sl || !sw || !pl || !pw) {
                resultDiv.className = "result error";
                resultDiv.innerHTML = "⚠️ Please fill in all four measurements.";
                return;
            }

            predictBtn.disabled = true;
            resultDiv.className = "result loading";
            resultDiv.innerHTML = '<span class="loader"></span>Analyzing measurements...';

            try {
                const res = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sepal_length: parseFloat(sl),
                        sepal_width: parseFloat(sw),
                        petal_length: parseFloat(pl),
                        petal_width: parseFloat(pw)
                    })
                });

                if (!res.ok) {
                    throw new Error("Server error");
                }

                const data = await res.json();
                const species = data.species.toLowerCase();
                const emoji = speciesEmojis[species] || '🌼';
                
                resultDiv.className = "result success";
                resultDiv.innerHTML = `<span class="species-icon">${emoji}</span><strong>Predicted Species:</strong> ${data.species}`;
            } catch (e) {
                resultDiv.className = "result error";
                resultDiv.innerHTML = "❌ Something went wrong. Please try again.";
            } finally {
                predictBtn.disabled = false;
            }
        });
    </script>

</html>
