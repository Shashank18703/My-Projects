<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit Lab – Handwritten Digit Recognition</title>
  <style>
    body {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      overflow-y: auto;
    }

    .container {
      min-height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 1100px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .columns {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      h1 {
        font-size: 2rem;
      }

      .card {
        padding: 1.5rem;
      }
    }

    .canvas-wrapper {
      background: #000;
      border-radius: 16px;
      padding: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.5rem;
    }

    #canvas {
      display: block;
      cursor: crosshair;
      border-radius: 8px;
      width: 100%;
      height: auto;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-clear {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .btn-clear:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .btn-predict {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .btn-predict:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
    }

    .brush-control {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .brush-control label {
      font-size: 0.9rem;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.9);
    }

    #brushSize {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }

    #brushSize::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
    }

    #brushSize::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
    }

    .tips {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
    }

    .pred-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .pred-label {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    #pred-main {
      font-size: 5rem;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .bar-digit {
      font-weight: 600;
      font-size: 1.1rem;
      width: 24px;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
    }

    .bar-container {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      height: 32px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
      border-radius: 8px;
      transition: width 0.6s ease;
      width: 0%;
    }

    .bar-value {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container">
   <div class="card">
    <div class="status-pill"><span class="status-dot"></span> Live digit recognition
    </div>
    <h1>Digit Lab</h1>
    <p class="subtitle">Draw any digit (0–9) and see what the neural network thinks.</p>
    <div class="columns"><!-- Left column: Drawing area -->
     <div>
      <div class="canvas-wrapper">
       <canvas id="canvas" width="280" height="280"></canvas>
      </div>
      <div class="controls"><button class="btn-clear" onclick="clearCanvas()">Clear</button> <button class="btn-predict" onclick="sendPrediction()">Predict</button>
      </div>
      <div class="brush-control"><label for="brushSize">Brush size:</label> <input type="range" id="brushSize" min="8" max="32" value="18" oninput="updateBrushSize()">
      </div>
      <p class="tips">💡 Tip: Draw larger digits for better accuracy. The model works best with centered, clear strokes.</p>
     </div><!-- Right column: Prediction panel -->
     <div>
      <div class="pred-card">
       <div class="pred-label">
        Current prediction
       </div>
       <div id="pred-main">
        –
       </div>
       <div class="pred-label">
        Confidence per digit
       </div>
       <div id="bars"></div>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function initCanvas() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#fff';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 18;
    }

    function updateBrushSize() {
      const brushSize = document.getElementById('brushSize').value;
      ctx.lineWidth = parseInt(brushSize);
    }

    function clearCanvas() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      document.getElementById('pred-main').textContent = '–';
      
      for (let d = 0; d <= 9; d++) {
        const barFill = document.getElementById(`bar-fill-${d}`);
        const barVal = document.getElementById(`bar-val-${d}`);
        if (barFill) barFill.style.width = '0%';
        if (barVal) barVal.textContent = '0%';
      }
    }

    function ensureBars() {
      const barsContainer = document.getElementById('bars');
      if (barsContainer.children.length > 0) return;

      for (let d = 0; d <= 9; d++) {
        const row = document.createElement('div');
        row.className = 'bar-row';

        const digit = document.createElement('div');
        digit.className = 'bar-digit';
        digit.textContent = d;

        const barContainer = document.createElement('div');
        barContainer.className = 'bar-container';

        const barFill = document.createElement('div');
        barFill.className = 'bar-fill';
        barFill.id = `bar-fill-${d}`;

        const barValue = document.createElement('div');
        barValue.className = 'bar-value';
        barValue.id = `bar-val-${d}`;
        barValue.textContent = '0%';

        barContainer.appendChild(barFill);
        barContainer.appendChild(barValue);

        row.appendChild(digit);
        row.appendChild(barContainer);

        barsContainer.appendChild(row);
      }
    }

    async function sendPrediction() {
      ensureBars();
      document.getElementById('pred-main').textContent = '…';

      const dataURL = canvas.toDataURL('image/png');

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataURL })
        });

        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const data = await res.json();
        document.getElementById('pred-main').textContent = data.predicted_digit;

        if (data.probs && data.probs.length === 10) {
          for (let d = 0; d <= 9; d++) {
            const p = Math.round(data.probs[d] * 100);
            const barFill = document.getElementById(`bar-fill-${d}`);
            const barVal = document.getElementById(`bar-val-${d}`);
            if (barFill) barFill.style.width = p + '%';
            if (barVal) barVal.textContent = p + '%';
          }
        }
      } catch (error) {
        console.error('Prediction error:', error);
        document.getElementById('pred-main').textContent = 'Error';
      }
    }

    // Mouse events for drawing
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      ctx.beginPath();
      ctx.moveTo(x, y);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      ctx.beginPath();
    });

    canvas.addEventListener('mouseleave', () => {
      isDrawing = false;
      ctx.beginPath();
    });

    // Touch events for mobile
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      ctx.beginPath();
      ctx.moveTo(x, y);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      isDrawing = false;
      ctx.beginPath();
    });

    // Initialize canvas on load
    initCanvas();
  </script>
